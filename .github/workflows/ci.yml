name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build static binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o gateway-tls-canary ./cmd/gateway-tls-canary
          ls -l gateway-tls-canary

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the example alert rules with promtool
        run: |
          docker run --rm -v "$PWD/examples:/examples:ro" --entrypoint promtool prom/prometheus:latest check rules /examples/alerts.yml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t gateway-tls-canary .
      - name: Report image size
        run: |
          docker image ls gateway-tls-canary --format 'size: {{.Size}}'
